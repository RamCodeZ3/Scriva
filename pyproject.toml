[project]
name = "scriva-backend"
version = "1.2.0"
description = "An AI-powered backend service that processes multiple sources of information to automatically draft and format documents in APA 7 style."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "diskcache>=5.6.3",
    "dotenv>=0.9.9",
    "fastapi>=0.136.1",
    "google-api-python-client>=2.196.0",
    "google-genai>=2.0.0",
    "jwt>=1.4.0",
    "jsonschema>=4.25.1",
    "openai-whisper>=20250625",
    "playwright>=1.62.0",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.20",
    "reportlab>=5.0.0",
    "requests>=2.33.1",
    "ruff>=0.15.14",
    "supabase>=2.31.0",
    "uvicorn>=0.52.1",
    "youtube-transcript-api>=1.2.4",
]
